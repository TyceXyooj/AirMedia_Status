{% extends 'base.html' %}
{% block head %}
    <title>AirMedia Monitoring</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        td img {
            width: 24px;
            height: 24px;
        }
    </style>
{% endblock %}

{% block body %}
    <h1>AirMedia Status Monitor</h1>
    
    <table>
        <thead>
            <tr>
                <th>Device Name</th>
                <th>IP Address</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="device-table">
            <!-- Rows will be injected here via JavaScript -->
        </tbody>
    </table>

    <!-- Script to fetch status every 30 seconds -->
    <script>
        function checkStatuses() {
            fetch('/updatestatus')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('device-table');
                    tbody.innerHTML = ""; // Clear old rows before adding updated ones
                    
                    data.forEach(device => {
                        const tr = document.createElement('tr');
                        
                        // Select check.png or x.png based on device.online (True/False)
                        const iconPath = device.online 
                            ? "{{ url_for('static', filename='check.png') }}" 
                            : "{{ url_for('static', filename='x.png') }}";
                        
                        tr.innerHTML = `
                            <td>${device.name}</td>
                            <td>${device.ip}</td>
                            <td><img src="${iconPath}" alt="${device.online ? 'Online' : 'Offline'}"></td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error("Error updating statuses:", err));
        }

        // Run immediately when the page loads
        checkStatuses();

        // Repeat every 30 seconds (30,000 milliseconds)
        setInterval(checkStatuses, 50);
    </script>
{% endblock %}
